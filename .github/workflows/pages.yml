name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy any branch by hand from the Actions tab, which is how
  # you would publish before this work is merged.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run is not cancelled, so a push during a
# deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The content checks run before the build, so a broken lesson fails
      # here rather than publishing a half-rendered player.
      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build static export
        env:
          PAGES: '1'
          # Serves from https://<owner>.github.io/<repo>/, so the base path
          # is the repository name. A user or organisation site, or a custom
          # domain, serves from the root and wants PAGES_BASE_PATH set to ''.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
